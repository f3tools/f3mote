name: Release f3mote

on:
  push:
    tags:
      - "host-v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump before publishing (none = publish current version)"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release-host
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Bump version, commit and tag
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release f3mote $VERSION"
          git tag "host-v$VERSION"
          git push origin HEAD:main --follow-tags

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/host-v')
        run: |
          TAG="${GITHUB_REF_NAME#host-v}"
          PKG=$(node -p "require('./host/package.json').version")
          ROOT=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$ROOT" ]; then
            echo "Tag host-v$TAG does not match host $PKG / root $ROOT" >&2
            exit 1
          fi

      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run host:build

      - name: Publish to npm
        working-directory: host
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESSTOKEN_WEBBOXES_BYPASS_2FA }}
        run: npm publish --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "host-v$VERSION" --title "f3mote $VERSION" --generate-notes || echo "Release host-v$VERSION already exists, skipping."
